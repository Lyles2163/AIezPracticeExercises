# Spring AI 模型客户端配置（OpenAI 兼容协议）
# 由 application.yaml 的 spring.config.import 引入，不要改文件名。
spring:
  ai:
    openai:
      api-key: ${EZ_NVIDIA_API_KEY:}  # 通过nacos变量注入（变量名沿用旧的，值已换成 NVIDIA key）
      base-url: https://integrate.api.nvidia.com  # NVIDIA NIM 的 OpenAI 兼容地址
      chat:
        options:
          # 遗留演示接口 GET /ai/chat（AiChatController）用 ChatClient 且不显式指定 model，
          # 这行是它唯一的模型来源 —— 删了会静默弄坏一个不相干的接口。
          # temperature / stream-usage 已删除：chat 子系统不再走 ChatClient。
          model: nvidia/nemotron-3-ultra-550b-a55b

      embedding:
        # 百炼的 OpenAI 兼容端点，必须单独覆盖 base-url/api-key，否则请求会发到 DeepSeek
        api-key: ${DASHSCOPE_API_KEY:}
        base-url: https://dashscope.aliyuncs.com/compatible-mode
        options:
          # 必须是 OpenAI 兼容模式支持的模型：qwen3-vl-embedding 是多模态模型，
          # 走兼容端点会 404 model_not_supported（2026-11-01 实测踩过）。
          # dimensions=1024 与 ES 索引 mapping 的 dims 必须一致，改这里等于重建索引。
          model: text-embedding-v3
          dimensions: 1024
