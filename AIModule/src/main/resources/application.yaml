spring:
  application:
    name: AIModuleServer

  ai:
    openai:
      api-key: ${EZ_DEEPSEEK_API_KEY:}  # DeepSeek API Key，通过环境变量注入
      base-url: https://api.deepseek.com  # DeepSeek 的 OpenAI 兼容地址
      chat:
        options:
          # 遗留演示接口 GET /ai/chat（AiChatController）用 ChatClient 且不显式指定 model，
          # 这行是它唯一的模型来源 —— 删了会静默弄坏一个不相干的接口。
          # temperature / stream-usage 已删除：chat 子系统不再走 ChatClient。
          model: deepseek-chat
      embedding:
        # 百炼的 OpenAI 兼容端点，必须单独覆盖 base-url/api-key，否则请求会发到 DeepSeek
        api-key: ${DASHSCOPE_API_KEY:}
        base-url: https://dashscope.aliyuncs.com/compatible-mode
        options:
          model: text-embedding-v3
          dimensions: 1024
  cloud:
    sentinel:
      transport:
        # ??sentinel??????
        dashboard: 127.0.0.1:8077
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml

  config:
    import:
      - optional:nacos:AIServer.yaml
      - nacos:common-jwt.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - nacos:AiLocal.properties?group=DEFAULT_GROUP&refreshEnabled=true
      # 本地密钥文件（已 gitignore，不进 jar），文件里给 EZ_DEEPSEEK_API_KEY 赋值。
      # 文件不存在时 optional: 静默跳过，此时需靠同名环境变量提供 key，两处只用一个。
#      - optional:file:F:/AAAJAVA/code/ezPracticeExercises/config/local.properties
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ezpracticeexercises
    username: root
    password:


rag:
  analyzer: ik                     # 安装 IK 失败时改 cjk
  admin-names: ${RAG_ADMIN_NAMES:}
  elasticsearch:
    uris: ${ES_URIS:https://127.0.0.1:9200}
    username: ${ES_USERNAME:elastic}
    password: ${ELASTIC_PASSWORD:}
    ca-cert-path: ${ES_CA_CERT:F:/ES/elasticsearch-9.5.4/config/certs/http_ca.crt}
  index:
    auto-create: true
    kb-alias: ai_kb_chunk
    kb-physical: ai_kb_chunk_v1
    question-alias: ai_question
    question-physical: ai_question_v1
  embedding:
    dimensions: 1024
    batch-size: 10
    concurrency: 4
  search:
    top-k-default: 6
    top-k-max: 20
    rrf-rank-constant: 60
    rank-window-size: 50
    knn-k: 20
    num-candidates: 100
    knn-similarity: 0.55
  async: poll
  dev-seed:
    enabled: false

chat:
  default-model: deepseek-chat
  default-effort: Medium
  models:
    - key: deepseek-chat
      name: deepseek-chat
      tag: Fast
      supports-thinking: false
    - key: deepseek-reasoner
      name: deepseek-reasoner
      tag: Reasoning
      supports-thinking: true
  efforts:
    - { key: Low,    temperature: 1.3, max-tokens: 4096 }
    - { key: Medium, temperature: 1.0, max-tokens: 4096 }
    - { key: High,   temperature: 0.7, max-tokens: 8192 }
    - { key: Extra,  temperature: 0.4, max-tokens: 8192 }
    - { key: Max,    temperature: 0.2, max-tokens: 16384 }
  system-prompt: ""
  context-max-tokens: 8000
  stream-timeout-ms: 300000
  stream-core-threads: 4
  stream-max-threads: 16
  heartbeat-interval-seconds: 15
  stale-stream-reap-minutes: 5
  thinking-enabled: true
  thinking-max-step-chars: 120
  thinking-max-steps: 12
  upstream-idle-timeout-seconds: 60


mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.a.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.a.entity

seata:
  enabled: true
  tx-service-group: a_group
  service:
    vgroup-mapping:
      a_group: default
    grouplist:
      default: 127.0.0.1:8091
  registry:
    type: file
  config:
    type: file

