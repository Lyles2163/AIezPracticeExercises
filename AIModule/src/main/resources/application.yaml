spring:
  application:
    name: AIModuleServer

  ai:
    openai:
      api-key: sk-032471b595b942f9913934a812f78cee  # 替换为你的 DeepSeek API Key
      base-url: https://api.deepseek.com  # DeepSeek 的 OpenAI 兼容地址
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
      embedding:
        # 百炼的 OpenAI 兼容端点，必须单独覆盖 base-url/api-key，否则请求会发到 DeepSeek
        api-key: ${DASHSCOPE_API_KEY:}
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        options:
          model: text-embedding-v3
          dimensions: 1024
  cloud:
    sentinel:
      transport:
        # ??sentinel??????
        dashboard: 127.0.0.1:8077
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml

  config:
    import:
      - optional:nacos:AIServer.yaml
      - nacos:common-jwt.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ezpracticeexercises
    username: root
    password:


rag:
  analyzer: ik                     # 安装 IK 失败时改 cjk
  admin-names: ${RAG_ADMIN_NAMES:}
  elasticsearch:
    uris: ${ES_URIS:https://127.0.0.1:9200}
    username: ${ES_USERNAME:elastic}
    password: ${ELASTIC_PASSWORD:}
    ca-cert-path: ${ES_CA_CERT:F:/ES/elasticsearch-9.5.4/config/certs/http_ca.crt}
  index:
    auto-create: true
    kb-alias: ai_kb_chunk
    kb-physical: ai_kb_chunk_v1
    question-alias: ai_question
    question-physical: ai_question_v1
  embedding:
    dimensions: 1024
    batch-size: 10
    concurrency: 4
  search:
    top-k-default: 6
    top-k-max: 20
    rrf-rank-constant: 60
    rank-window-size: 50
    knn-k: 20
    num-candidates: 100
    knn-similarity: 0.55
  async: poll


mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.a.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.a.entity

seata:
  enabled: true
  tx-service-group: a_group
  service:
    vgroup-mapping:
      a_group: default
    grouplist:
      default: 127.0.0.1:8091
  registry:
    type: file
  config:
    type: file

