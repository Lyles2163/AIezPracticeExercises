spring:
  application:
    name: AIModuleServer

  ai:
    openai:
      api-key: ${EZ_NVIDIA_API_KEY:}  # 通过环境变量注入（变量名沿用旧的，值已换成 NVIDIA key）
      base-url: https://integrate.api.nvidia.com  # NVIDIA NIM 的 OpenAI 兼容地址
      chat:
        options:
          # 遗留演示接口 GET /ai/chat（AiChatController）用 ChatClient 且不显式指定 model，
          # 这行是它唯一的模型来源 —— 删了会静默弄坏一个不相干的接口。
          # temperature / stream-usage 已删除：chat 子系统不再走 ChatClient。
          model: nvidia/nemotron-3-ultra-550b-a55b
      embedding:
        # 百炼的 OpenAI 兼容端点，必须单独覆盖 base-url/api-key，否则请求会发到 DeepSeek
        api-key: ${DASHSCOPE_API_KEY:}
        base-url: https://dashscope.aliyuncs.com/compatible-mode
        options:
          # 必须是 OpenAI 兼容模式支持的模型：qwen3-vl-embedding 是多模态模型，
          # 走兼容端点会 404 model_not_supported（2026-11-01 实测踩过）。
          # dimensions=1024 与 ES 索引 mapping 的 dims 必须一致，改这里等于重建索引。
          model: text-embedding-v3
          dimensions: 1024
  cloud:
    sentinel:
      transport:
        # ??sentinel??????
        dashboard: 127.0.0.1:8077
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml

  config:
    import:
      - optional:nacos:AIServer.yaml
      - nacos:common-jwt.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - nacos:AiLocal.properties?group=DEFAULT_GROUP&refreshEnabled=true
      # 本地密钥文件（已 gitignore，不进 jar），文件里给 EZ_DEEPSEEK_API_KEY 赋值。
      # 文件不存在时 optional: 静默跳过，此时需靠同名环境变量提供 key，两处只用一个。
      # EZ_PET_API_KEY 只在本文件里，Nacos 没有：缺它则 chat.openai-compat.api-key 解析成空，
      # /ai/v1 会按设计自我关闭成 503，桌宠对话直接不可用。
      - optional:file:F:/AAAJAVA/code/ezPracticeExercises/config/local.properties
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ezpracticeexercises
    username: root
    password:
  servlet:
    multipart:
      # 知识库文档上传上限。Spring Boot 默认单文件仅 1MB，不改的话正常教材在进
      # Controller 之前就被 MaxUploadSizeExceededException 拒掉。
      # 这两个值必须 >= rag.ingest.max-file-bytes，否则业务层的校验永远轮不到执行。
      max-file-size: 20MB
      max-request-size: 25MB


rag:
  analyzer: ik                     # IK 中文分词（已验证正常）；IK 不可用时改 cjk
  admin-names: ${RAG_ADMIN_NAMES:}
  elasticsearch:
    uris: ${ES_URIS:https://127.0.0.1:9200}
    username: ${ES_USERNAME:elastic}
    password: ${ELASTIC_PASSWORD:EZ_elastic_2026}
    ca-cert-path: ${ES_CA_CERT:F:/ES/elasticsearch-9.5.4/config/certs/http_ca.crt}
  index:
    auto-create: true
    kb-alias: ai_kb_chunk
    kb-physical: ai_kb_chunk_v1
    question-alias: ai_question
    question-physical: ai_question_v1
  embedding:
    dimensions: 1024
    batch-size: 10
    concurrency: 4
  search:
    top-k-default: 6
    top-k-max: 20
    rrf-rank-constant: 60
    rank-window-size: 50
    knn-k: 20
    num-candidates: 100
    knn-similarity: 0.55
  ingest:
    # 必须 <= spring.servlet.multipart.max-file-size，否则 multipart 会先拒，
    # 这里的业务校验永远轮不到执行，用户看到的是框架错误而不是中文提示。
    max-file-bytes: 20971520       # 20MB
    max-chunks-per-doc: 2000
    mysql-batch-size: 200
    storage-dir:                   # 留空=只存元数据不存原件，重建索引靠 rag_chunk.content 重放
    allowed-extensions: txt,md,markdown,text
  async: poll
  dev-seed:
    enabled: false

chat:
  default-model: nvidia/nemotron-3-ultra-550b-a55b
  default-effort: Medium
  models:
    - key: nvidia/nemotron-3-ultra-550b-a55b
      name: nvidia/nemotron-3-ultra-550b-a55b
      tag: Ultra
      supports-thinking: false
  efforts:
    - { key: Low,    temperature: 1.3, max-tokens: 4096 }
    - { key: Medium, temperature: 1.0, max-tokens: 4096 }
    - { key: High,   temperature: 0.7, max-tokens: 8192 }
    - { key: Extra,  temperature: 0.4, max-tokens: 8192 }
    - { key: Max,    temperature: 0.2, max-tokens: 16384 }
  system-prompt: ""
  context-max-tokens: 8000
  stream-timeout-ms: 300000
  stream-core-threads: 4
  stream-max-threads: 16
  heartbeat-interval-seconds: 15
  stale-stream-reap-minutes: 5
  # 值直接引用 spring.ai.openai.*：API key 的唯一真相源仍是 config/local.properties
  # 里的 EZ_DEEPSEEK_API_KEY（变量名沿用旧的，值已换成 NVIDIA key）。
  # 不新增第二个键，免得两处能配得不一样。
  api-key: ${spring.ai.openai.api-key:}
  base-url: ${spring.ai.openai.base-url:https://integrate.api.nvidia.com}
  thinking-enabled: true
  thinking-max-step-chars: 120
  thinking-max-steps: 12
  upstream-idle-timeout-seconds: 60
  # 桌宠（dsh-pet 独立模式）的 OpenAI 兼容链：POST /ai/v1/chat/completions。
  # 这条链不经登录 JWT（网关按完整路径放行），所以 api-key 留空 = 路由直接 503 关闭，不是放行。
  # 键值与 EZ_DEEPSEEK_API_KEY 同一个来源；user-name 决定桌宠轮次落在谁的会话列表里。
  openai-compat:
    api-key: ${EZ_PET_API_KEY:}
    user-name: test920
    conversation-title: 桌宠对话
    effort: ""


mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.a.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.a.entity

seata:
  enabled: true
  tx-service-group: a_group
  service:
    vgroup-mapping:
      a_group: default
    grouplist:
      default: 127.0.0.1:8091
  registry:
    type: file
  config:
    type: file

