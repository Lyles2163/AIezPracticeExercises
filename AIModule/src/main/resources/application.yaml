server:
  port: 8105

# 历史遗留，已被 CommonJwt + Nacos common-jwt.yaml 取代
#leon:
#  jwt:
#    secret: "LeonSecretKeyForJWTInEzPracticeExercises2026IsVeryLongAndComplexNow"
#    expiration: 7200000 # 2 小时


spring:
  application:
    name: AIModuleServer

  cloud:
    sentinel:
      transport:
        # sentinel 控制台地址
        dashboard: 127.0.0.1:8077
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml

  config:
    # 顺序即优先级：越靠后越优先，可以覆盖前面所有文件里的同名 key。
    # 所以本地拆分文件放在 Nacos 之前 —— 保持和拆分前一样的语义，
    # Nacos 上的 AIServer.yaml 仍然能覆盖 classpath 里的默认值。
    import:
      # ---- 按领域拆分的本地配置（classpath:config/ 下，随 jar 一起打包）----
      # 故意不加 optional:：文件丢了/改名了要立刻启动失败，而不是静默少配一项。
      - classpath:config/ai.yaml            # Spring AI 模型客户端
      - classpath:config/rag.yaml           # 知识库：ES、索引、检索、入库
      - classpath:config/chat.yaml          # 对话：模型档位、SSE、供应商、桌宠
      - classpath:config/imagegen.yaml      # AI 生图：MinIO 与限额
      - classpath:config/persistence.yaml   # MySQL / MyBatis / Seata
      # ---- 远程与本地密钥 ----
      - optional:nacos:AIServer.yaml
      - nacos:common-jwt.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - nacos:AiLocal.properties?group=DEFAULT_GROUP&refreshEnabled=true
      # 本地密钥文件（已 gitignore，不进 jar），文件里给 EZ_DEEPSEEK_API_KEY 赋值。
      # 文件不存在时 optional: 静默跳过，此时需靠同名环境变量提供 key，两处只用一个。
      # EZ_PET_API_KEY 只在本文件里，Nacos 没有：缺它则 chat.openai-compat.api-key 解析成空，
      # /ai/v1 会按设计自我关闭成 503，桌宠对话直接不可用。
      - optional:file:F:/AAAJAVA/code/ezPracticeExercises/config/local.properties
