server:
  port: 8103

#leon:
#  jwt:
#    secret: "LeonSecretKeyForJWTInEzPracticeExercises2026IsVeryLongAndComplexNow"
#    expiration: 7200000 # 2小时，单位毫秒

spring:
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
  application:
    name: AuthModuleServer
  cloud:
    sentinel:
      transport:
        # ??sentinel??????
        dashboard: 127.0.0.1:8077
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
  config:
    import:
      - optional:nacos:AuthModuleServer.yaml
      - nacos:common-jwt.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ezpracticeexercises
    username: root
    password:
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        prefetch: 1 # 预取值，即一次只处理一个消息

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: org.leon.authmodule.pojo
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

auth:
  sms:
    # 验证码有效期；队列 TTL 是创建参数，改这个值必须同时改 auth.sms.queue-suffix，
    # 否则 Broker 上同名旧队列参数不一致会报 PRECONDITION_FAILED。
    code-ttl-ms: 300000
    queue-suffix: ""
  internal:
    # UserModule 调 /auth/internal/** 时携带的共享令牌，两端必须一致
    token: "dev-internal-token"