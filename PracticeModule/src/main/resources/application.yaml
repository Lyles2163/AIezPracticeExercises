server:
  port: 8102


spring:
  application:
    name: PracticeModuleServer
  cloud:
    sentinel:
      transport:
        # ??sentinel??????
        dashboard: 127.0.0.1:8077
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
  config:
    import:
      - optional:nacos:PracticeModuleServer.yaml
      - nacos:common-jwt.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        # 判题是重活：一次只取一条，别囤积压垮 Docker
        prefetch: 1
        # 两个消费者并行判，太多会把本机 Docker 打满
        concurrency: 2
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
          multiplier: 2
          max-interval: 10000
        # 重试耗尽后必须拒绝而不是重回队首，否则死信永远为空并无限重消费
        default-requeue-rejected: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ezpracticeexercises
    username: root
    password:
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: # 如果有密码填这里，没有就留空或删掉
      database: 1
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0


practice:
  identity:
    cache-ttl-seconds: 1800
  exam:
    # 超时宽限秒数（spec 8）：只有 ExamDeadline 读它，start/draft/submit 三个入口共用同一次判据
    grace-seconds: 60

oj:
  sandbox:
    # 单次提交源码上限（字节）。超过直接 40000，不落库
    max-source-bytes: 65536
    # 编译阶段的容器内存与超时，与题目自身的运行限制分开。
    # 30s 是给"镜像首次冷启动"留的余量：实测首题编译曾超过 15s 被误判成 CE。
    compile-memory-mb: 512
    compile-timeout-ms: 30000
    # 单个用例输出最多读回多少字节，防止用户程序无限打印把服务端内存打爆
    max-output-bytes: 1048576

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: org.leon.practicemodule.pojo
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

seata:
  enabled: true
  tx-service-group: a_group
  service:
    vgroup-mapping:
      a_group: default
    grouplist:
      default: 127.0.0.1:8091
  registry:
    type: file
  config:
    type: file

